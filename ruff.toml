target-version = "py313"
line-length = 88
extend-exclude = [
    "**/*.md",
    "conformance/**",
    "crates/pyrefly_bundled/**",
    "crates/tsp_types/**",
    "pyrefly/lib/report/scip/snapshots/**",
    "pyrefly/lib/test/**",
    "test/**",
    "website/**",
]

[lint]
select = ["I"]
fixable = ["I"]

[lint.isort]
combine-as-imports = true
order-by-type = false
