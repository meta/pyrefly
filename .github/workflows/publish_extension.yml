name: "Publish: VS Code extension"

# Packages the extension with the executables from the release wheels, tests
# every package, and publishes them. publish_to_pypi.yml calls this workflow
# with the wheels it built in the same run, so the extension ships the same
# binaries as PyPI. A manual run builds and tests the wheels first.

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build and test the wheels'
        type: boolean
        default: true
  workflow_call:
    inputs:
      build:
        description: 'Build and test the wheels instead of using the `dist` artifact of the calling run'
        type: boolean
        default: false
    secrets:
      VSCE_PAT:
        required: true
      OPENVSX_TOKEN:
        required: true

jobs:
    build:
        if: ${{ inputs.build }}
        uses: ./.github/workflows/publish_build_packages.yml

    test:
        if: ${{ inputs.build }}
        uses: ./.github/workflows/ci_pyrefly.yml

    package:
        needs: build
        if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
        uses: ./.github/workflows/ci_extension_test.yml
        with:
            wheels: true

    publish_code_marketplace:
        runs-on: ubuntu-latest
        needs:
          - package
          - test
        if: ${{ !cancelled() && needs.package.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
        steps:
            - name: upload
              uses: actions/download-artifact@v7
              with:
                pattern: pyrefly-*
            - name: publish
              # The extension declares the `editorHoverVerbosityLevel` proposed API, which
              # `vsce publish` rejects by default. Bypassing the check is safe because
              # `lsp/src/extension.ts` falls back to the ordinary LSP hover when the editor
              # has not granted access to the proposal.
              run: npx @vscode/vsce publish ${{ needs.package.outputs.prerelease_flag }} --allow-proposed-apis editorHoverVerbosityLevel --skip-duplicate --packagePath $(find . -iname '*.vsix')
              env:
                VSCE_PAT: ${{ secrets.VSCE_PAT }}

    publish_openvsx:
        runs-on: ubuntu-latest
        needs:
          - package
          - test
        if: ${{ !cancelled() && needs.package.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
        steps:
            - name: upload
              uses: actions/download-artifact@v7
              with:
                pattern: pyrefly-*
            - name: publish
              shell: bash
              run: |
                set -euo pipefail

                shopt -s nullglob
                packages=(./*/*.vsix)
                if [ "${#packages[@]}" -eq 0 ]; then
                  echo "No VSIX packages found"
                  exit 1
                fi

                for attempt in 1 2 3; do
                  if npx ovsx publish ${{ needs.package.outputs.prerelease_flag }} --skip-duplicate --packagePath "${packages[@]}"; then
                    exit 0
                  fi

                  if [ "$attempt" -eq 3 ]; then
                    exit 1
                  fi

                  sleep_seconds=$((30 * (2 ** (attempt - 1))))
                  echo "OpenVSX publish failed; retrying in ${sleep_seconds}s"
                  sleep "$sleep_seconds"
                done
              env:
                OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}
